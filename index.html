<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cluedo Robot Players</title>
<meta name="description" content="Robot players for a real game of Cluedo or Clue. They're dealt cards and answer suggestions, so two people can play like a full table.">
<meta name="theme-color" content="#151C29">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Figtree:wght@400..800&family=Special+Elite&display=swap">
<link rel="stylesheet" href="app.css">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; } [hidden] { display: none !important; }</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></symbol>
    <symbol id="i-robot" viewBox="0 0 24 24"><rect x="4.5" y="8" width="15" height="11.5" rx="2.5"/><path d="M12 8V5"/><circle cx="12" cy="3.9" r="1.2" fill="currentColor" stroke="none"/><circle cx="9.3" cy="13" r="1.35" fill="currentColor" stroke="none"/><circle cx="14.7" cy="13" r="1.35" fill="currentColor" stroke="none"/><path d="M9.6 16.6h4.8M2.5 12.5v3M21.5 12.5v3"/></symbol>
    <symbol id="i-suspect" viewBox="0 0 24 24"><path d="M5.5 9.5h13"/><path d="M8 9.5l1.1-4.6h5.8L16 9.5"/><circle cx="12" cy="13" r="3"/><path d="M5.5 21c.8-3 3.4-4.6 6.5-4.6s5.7 1.6 6.5 4.6"/></symbol>
    <symbol id="i-weapon" viewBox="0 0 24 24"><path d="M20 4l-2.2 5.3-6.2 6.2-3.1-3.1 6.2-6.2z"/><path d="M7 10.9l6.1 6.1"/><path d="M10 14l-4.4 4.4"/><circle cx="4.8" cy="19.2" r="1.1"/></symbol>
    <symbol id="i-room" viewBox="0 0 24 24"><path d="M3.5 20.5h17"/><path d="M6.5 20.5v-16h11v16"/><circle cx="14.6" cy="12.6" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2"/></symbol>
    <symbol id="i-glass" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5l6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></symbol>
  </defs>
</svg>
<main id="app"><p style="padding:24px">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!-- The live scanner for dealing by scanning the backs (scan-screen.js). It never names a card. -->
<div class="scanner" id="live" hidden>
  <div class="scanner-top">
    <p class="scanner-status" role="status" aria-live="polite">Starting the camera…</p>
    <p class="scanner-count"></p>
  </div>
  <div class="scanner-view">
    <video muted playsinline></video>
    <canvas class="scanner-marks" aria-hidden="true"></canvas>
  </div>
  <div class="scanner-bottom">
    <canvas class="minimap" aria-hidden="true"></canvas>
    <p class="scanner-key" hidden><span class="found">read</span><span class="waiting" hidden>seen, can’t read yet</span><span class="camera">what the camera sees</span></p>
    <div class="settle" aria-hidden="true"><span></span></div>
    <p class="scanner-info"></p>
    <div class="scanner-buttons">
      <button class="btn btn--ghost" type="button" data-scan="cancel">Cancel</button>
      <button class="btn btn--primary" type="button" data-scan="done">Done</button>
    </div>
  </div>
</div>
<noscript><p style="padding:24px">This game needs JavaScript turned on.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
